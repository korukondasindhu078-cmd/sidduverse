<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>SIDDUVERSE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#e8eeff;font-family:Jost,system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#tscrim{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 2.4s;background:linear-gradient(to bottom,rgba(2,5,16,0) 38%,rgba(2,5,16,.55) 66%,rgba(2,5,16,.35) 100%)}
#tscrim.on{opacity:1}
#title{position:fixed;left:0;right:0;top:41%;transform:translateY(-50%);text-align:center;padding:0 5%;pointer-events:none;opacity:0;transition:opacity 3.2s ease,top 2.6s cubic-bezier(.45,0,.2,1)}
#title.on{opacity:1}#title.up{top:14%}
#title h1{margin:0;font:500 clamp(28px,8.4vw,74px) "Cormorant Garamond",Georgia,serif;letter-spacing:.3em;text-indent:.3em;white-space:nowrap;color:#f2f5ff;text-shadow:0 0 28px rgba(2,5,16,.95),0 2px 8px rgba(2,5,16,.9),0 0 46px rgba(150,170,255,.25)}
#title p{margin:12px 0 0;font:italic 500 clamp(16px,4.4vw,23px) "Cormorant Garamond",Georgia,serif;letter-spacing:.04em;color:#cbd7ff;opacity:0;transition:opacity 2.8s ease 1.6s;text-shadow:0 0 18px rgba(2,5,16,.95),0 2px 6px rgba(2,5,16,.9)}
#title.on p{opacity:1}
#tx{position:fixed;left:0;right:0;top:58%;padding:0 9%;text-align:center;pointer-events:none;font:500 clamp(21px,5.6vw,32px)/1.45 "Cormorant Garamond",Georgia,serif;color:#f1f4ff;opacity:0;transition:opacity .7s ease;text-shadow:0 0 18px rgba(2,5,16,.95),0 2px 6px rgba(2,5,16,.9)}
#tx.on{opacity:1}#tx.slow{transition:opacity .9s ease}#tx.name{letter-spacing:.04em;text-shadow:0 0 18px rgba(2,5,16,.95),0 2px 6px rgba(2,5,16,.9),0 0 30px rgba(170,190,255,.45)}
#gate{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:500 11px Jost,sans-serif;letter-spacing:.42em;color:#b9c6ee;opacity:0;transition:opacity 1.6s;pointer-events:none;text-indent:.42em}
#gate.on{opacity:.55}
#begin{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 11%);transform:translateX(-50%);padding:16px 30px;min-height:52px;border-radius:999px;border:1px solid rgba(200,214,255,.7);background:rgba(6,10,26,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#e8eeff;font:500 13px Jost,sans-serif;letter-spacing:.3em;text-indent:.3em;white-space:nowrap;cursor:pointer;opacity:0;visibility:hidden;transition:opacity 1.8s,box-shadow .5s,visibility 0s 1.8s}
#begin.on{opacity:1;visibility:visible;transition:opacity 1.8s,box-shadow .5s;box-shadow:0 0 30px rgba(150,170,255,.28)}
#begin:hover{box-shadow:0 0 36px rgba(170,190,255,.45)}
:focus-visible{outline:2px solid #9fb4ff;outline-offset:4px}
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid rgba(160,185,230,.28);background:rgba(5,9,22,.45);color:rgba(223,230,242,.85);cursor:pointer;display:grid;place-items:center;padding:0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity 2s}
#mute.on{opacity:1}
#mute svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
#mute .slash{display:none}#mute.off .slash{display:block}#mute.off .wave{display:none}
#skip{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;z-index:5;height:40px;padding:0 14px;border-radius:20px;border:1px solid rgba(160,185,230,.25);background:rgba(5,9,22,.4);color:rgba(210,220,245,.75);font:500 10px Jost,sans-serif;letter-spacing:.26em;cursor:pointer;display:none}
#skip.on{display:block}
#orig{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050b20;opacity:0;transition:opacity 2.2s ease;z-index:10;pointer-events:none}
#orig.on{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){#title{transition:opacity 1.2s ease,top 1s ease}}
</style></head>

const $=id=>document.getElementById(id);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const R=matchMedia('(prefers-reduced-motion:reduce)').matches;
const K=R?.4:1;                                   // reduced-motion: everything ~2.5x quicker, no drifting stars
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeIn=t=>t*t*t;const lin=t=>t;
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const COARSE=matchMedia('(pointer:coarse)').matches;

/* ---------- tweens ---------- */
const TW=[];
function tween(o,to,ms,ez=ease){return new Promise(res=>{
  for(let i=TW.length;i--;)if(TW[i].o===o){const t=TW.splice(i,1)[0];t.res()}
  const from={};for(const k in to)from[k]=o[k];
  TW.push({o,from,to,t:0,d:Math.max(ms*K,1)/1000,ez,res})})}
function step(dt){for(let i=TW.length;i--;){const w=TW[i];w.t+=dt;const k=Math.min(1,w.t/w.d),e=w.ez(k);for(const p in w.to)w.o[p]=lerp(w.from[p],w.to[p],e);if(k>=1){TW.splice(i,1);w.res()}}}

/* ---------- scene ---------- */
const cv=$('c'),ctx=cv.getContext('2d',{alpha:false});
const IW=768,IH=1246;
const S={stars:0,img:0,mask:1,navy:0};
const camY={cy:IH*.34},camZ={z:1.0};
let W=0,H=0,DPR=1,vig=null,T=0,started=false,done=false;
const img=new Image();
const N=COARSE?150:240,ST=[];
(()=>{let s=12345;const r=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296};
 for(let i=0;i<N;i++)ST.push({a:r()*6.283,r:r()*Math.max(innerWidth,innerHeight)*.7,v:4+r()*26,z:.4+r()*1.2,ph:r()*6.28,sp:.5+r()*2});})();
function resize(){
  W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,COARSE?1.25:1.5);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  vig=document.createElement('canvas');vig.width=Math.max(2,Math.round(W/2));vig.height=Math.max(2,Math.round(H/2));
  const g=vig.getContext('2d'),w=vig.width,h=vig.height,gr=g.createRadialGradient(w/2,h/2,Math.min(w,h)*.35,w/2,h/2,Math.max(w,h)*.8);
  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.34)');g.fillStyle=gr;g.fillRect(0,0,w,h);
}
addEventListener('resize',resize);

function draw(dt){
  const s=Math.max(W/IW,H/IH)*camZ.z,sw=W/s,sh=H/s;
  const cy=clamp(camY.cy,sh/2,IH-sh/2),sx=clamp(IW/2-sw/2,0,Math.max(0,IW-sw)),sy=cy-sh/2;
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  // the galaxy and the planet (one approved image)
  if(S.img>.002&&img.complete&&img.naturalWidth){ctx.globalAlpha=S.img;try{ctx.drawImage(img,sx,sy,sw,sh,0,0,W,H)}catch(e){}ctx.globalAlpha=1}
  // the planet rises out of the dark
  if(S.mask>.002){const yb=(IH*.655-sy)*s,y0=yb-H*.14,g=ctx.createLinearGradient(0,y0,0,y0+H*.24);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,1)');
    ctx.globalAlpha=S.mask;ctx.fillStyle=g;ctx.fillRect(0,y0,W,H*.24);ctx.fillStyle='#000';ctx.fillRect(0,y0+H*.24-1,W,H);ctx.globalAlpha=1}
  // stars drifting outward — the slow feeling of moving forward
  const vis=Math.floor(S.stars*N),cx0=W/2,cy0=H*.46,maxR=Math.hypot(W,H)*.55;
  ctx.fillStyle='#dfe9ff';
  for(let i=0;i<vis;i++){const t=ST[i];if(!R&&dt)t.r+=t.v*t.z*dt*(1+Math.min(T,60)/50);if(t.r>maxR)t.r=2+Math.random()*30;
    const x=cx0+Math.cos(t.a)*t.r,y=cy0+Math.sin(t.a)*t.r,fi=clamp(t.r/60,0,1),tw=.6+.4*Math.sin(T*t.sp+t.ph);
    ctx.globalAlpha=Math.min(1,(S.stars*1.4-i/N))*fi*tw*.8;const sz=.5+t.z*.9+t.r/maxR*.9;ctx.fillRect(x-sz/2,y-sz/2,sz,sz)}
  ctx.globalAlpha=1;
  ctx.drawImage(vig,0,0,W,H);
  if(S.navy>.002){ctx.globalAlpha=S.navy;ctx.fillStyle='#050b20';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
}
let last=performance.now(),raf=0;
function frame(now){
  raf=requestAnimationFrame(frame);
  if(document.hidden){last=now;return}
  const dt=Math.min((now-last)/1000,.05);last=now;T+=dt;step(dt);draw(dt);
}
document.addEventListener('visibilitychange',()=>{last=performance.now();if(AC)document.hidden?AC.suspend().catch(()=>{}):AC.resume().catch(()=>{})});

/* ---------- audio: low rumble, faint ambience, one soft swell. All optional. ---------- */
let AC=null,master=null,rumG=null,subG=null,padG=null,muted=ls.get(CFG.KEY.mute)==='1',astarted=false,voiceEl=null;
function setMuteUI(){const b=$('mute');b.classList.toggle('off',muted);b.setAttribute('aria-label',muted?'Sound off. Tap to unmute':'Sound on. Tap to mute')}
setMuteUI();
function audioStart(){
  if(astarted){if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return}
  astarted=true;
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);
    const len=AC.sampleRate*4,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let l=0;for(let i=0;i<len;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}
    const ns=AC.createBufferSource();ns.buffer=buf;ns.loop=true;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=110;lp.Q.value=.7;
    rumG=AC.createGain();rumG.gain.value=0;ns.connect(lp);lp.connect(rumG);rumG.connect(master);ns.start();
    const sub=AC.createOscillator();sub.type='sine';sub.frequency.value=41;subG=AC.createGain();subG.gain.value=0;sub.connect(subG);subG.connect(master);sub.start();
    const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.07;lg.gain.value=.02;lfo.connect(lg);lg.connect(subG.gain);lfo.start();
    const pl=AC.createBiquadFilter();pl.type='lowpass';pl.frequency.value=1100;padG=AC.createGain();padG.gain.value=0;pl.connect(padG);padG.connect(master);
    [[220,0],[329.6,4],[440,-5],[554.4,3]].forEach(([f,dt],i)=>{const o=AC.createOscillator();o.type='sine';o.frequency.value=f;o.detune.value=dt;const g=AC.createGain();g.gain.value=i?.35:.6;o.connect(g);g.connect(pl);o.start()});
    const t=AC.currentTime;rumG.gain.setTargetAtTime(.55,t,2.2);subG.gain.setTargetAtTime(.1,t,2.6);
  }catch(e){AC=null}
}
function rumbleSettle(){if(!AC)return;const t=AC.currentTime;rumG.gain.setTargetAtTime(.2,t,3);subG.gain.setTargetAtTime(.05,t,3)}
function padUp(){if(!AC)return;padG.gain.setTargetAtTime(.02,AC.currentTime,3)}
function swell(){if(!AC)return;const t=AC.currentTime;padG.gain.setTargetAtTime(.05,t,.9);rumG.gain.setTargetAtTime(.45,t,.9);setTimeout(()=>{if(AC&&padG){padG.gain.setTargetAtTime(0,AC.currentTime,1.2);rumG.gain.setTargetAtTime(0,AC.currentTime,1.2);subG.gain.setTargetAtTime(0,AC.currentTime,1.2)}},2600)}
$('mute').onclick=e=>{e.stopPropagation();audioStart();muted=!muted;ls.set(CFG.KEY.mute,muted?'1':'0');setMuteUI();if(master)master.gain.setTargetAtTime(muted?0:1,AC.currentTime,.12);if(voiceEl)voiceEl.muted=muted};
function playVoice(i){const src=CFG.VOICE[i];if(!src||muted)return Promise.resolve();return new Promise(res=>{try{const a=new Audio(src);voiceEl=a;a.onended=a.onerror=()=>res();a.play().catch(()=>res())}catch(e){res()}})}

/* ---------- input ---------- */
let tapWaiters=[];
addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('#mute,#skip,#begin'))return;audioStart();const w=tapWaiters;tapWaiters=[];w.forEach(f=>f())});
addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){if(document.activeElement&&document.activeElement.tagName==='BUTTON')return;audioStart();const w=tapWaiters;tapWaiters=[];w.forEach(f=>f());if(started&&$('begin').classList.contains('on')){e.preventDefault();begin()}}});
const nextTap=()=>new Promise(r=>tapWaiters.push(r));
const sleepOrTap=ms=>Promise.race([wait(ms*K),nextTap()]);

/* ---------- the sequence ---------- */
async function run(){
  const g=$('gate');
  await wait(700);g.classList.add('on');
  await Promise.race([nextTap(),wait(7000)]);          // a tap starts with sound; otherwise it begins silently
  g.classList.remove('on');started=true;
  if(ls.get(CFG.KEY.seen)==='1')$('skip').classList.add('on');
  await wait(700*K);$('mute').classList.add('on');
  // PHASE 01 — the first sight (no text)
  tween(S,{stars:1},4200,lin);
  tween(camZ,{z:1.14},40000,lin);
  tween(camY,{cy:IH*.62},20000,ease);
  await wait(1500*K);padUp();
  tween(S,{img:1},5600);
  await wait(2900*K);
  tween(S,{mask:0},5400);
  await wait(5400*K);rumbleSettle();
  await wait(4200*K);                                   // let the reveal breathe
  if(done)return;
  // PHASE 02 — the title, inside the scene
  $('title').classList.add('on');
  await wait(3400*K);
  if(done)return;
  // PHASE 03 — the first transmission
  $('title').classList.add('up');$('tscrim').classList.add('on');
  await wait(1500*K);
  const tx=$('tx');
  for(let i=0;i<LINES.length&&!done;i++){
    tx.textContent=LINES[i];tx.className=(i===3?'name ':'')+'on';
    const hold=clamp(LINES[i].length*38,1400,2800)+(i===3?400:0);
    await Promise.all([sleepOrTap(750+hold),playVoice(i)]);
    tx.classList.remove('on');await wait(650*K);
  }
  if(done)return;
  // PHASE 04 — initialise journey
  await wait(300*K);$('begin').classList.add('on');$('begin').focus({preventScroll:true});
}

/* ---------- hand-off into ORIGIN: one continuous dive, no loading screen ---------- */
async function begin(){
  if(done)return;done=true;audioStart();ls.set(CFG.KEY.seen,'1');tapWaiters=[];
  $('begin').classList.remove('on');$('skip').classList.remove('on');
  $('tx').classList.remove('on');$('title').classList.remove('on');$('tscrim').classList.remove('on');
  swell();
  tween(S,{mask:0},300);
  tween(camZ,{z:Math.max(camZ.z,2.4)},4400,easeIn);tween(camY,{cy:IH*.86},4400,ease);
  const t0=performance.now();let loaded=false;
  const url=CFG.ORIGIN_URL;
  let fr=null;
  if(url){fr=document.createElement('iframe');fr.id='orig';fr.title='ORIGIN';fr.setAttribute('allow','autoplay');fr.onload=()=>{loaded=true};fr.src=url+(url.indexOf('?')<0?'?':'&')+'hold';document.body.appendChild(fr)}
  await wait(1900*K);tween(S,{navy:1},2300*K);
  await wait(2500*K);
  try{dispatchEvent(new CustomEvent('sidduverse:begin',{detail:{planet:'origin'}}));parent!==window&&parent.postMessage({type:'sidduverse:begin',planet:'origin'},'*')}catch(e){}
  if(!fr)return;
  const t1=performance.now();while(!loaded&&performance.now()-t0<12000)await wait(100);
  if(!loaded){location.href=url;return}
  fr.classList.add('on');try{fr.contentWindow.postMessage({type:'sidduverse:go'},'*')}catch(e){}
  await wait(2400);
  cancelAnimationFrame(raf);cv.style.display='none';$('tscrim').style.display='none';$('mute').style.display='none';
  try{fr.focus()}catch(e){}
}
$('begin').onclick=begin;$('skip').onclick=begin;

/* ---------- boot ---------- */
function boot(){
  resize();
  img.src=IMG;
  img.decode&&img.decode().catch(()=>{});
  raf=requestAnimationFrame(t=>{last=t;frame(t)});
  run();
}
window.__op={get t(){return T},get done(){return done},S,camZ,camY,LINES};
boot();
})();
</script>
