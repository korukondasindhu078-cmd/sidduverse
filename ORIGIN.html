<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030615">
<title>ORIGIN — The Captain’s Universe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap">
<style>
:root{--navy:#030615;--gold:#d4b36a;--silver:#dfe6f2;--blue:#8fb0ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--navy);overflow:hidden;color:var(--silver);font-family:Jost,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;overflow:hidden}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

/* title + fragment line */
#tag{position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity 1.8s;font:500 26px "Cormorant Garamond",Georgia,serif;letter-spacing:.1em;white-space:nowrap;text-shadow:0 1px 3px rgba(3,6,21,.9),0 2px 16px rgba(3,6,21,.9)}
#tag small{display:block;font:500 11px Jost,sans-serif;letter-spacing:.3em;color:#c3d4ff;margin-top:5px}
#tag.on{opacity:1}
#ftag{position:absolute;top:calc(env(safe-area-inset-top,0px) + 82px);left:50%;transform:translateX(-50%);opacity:0;transition:opacity 1.6s;font:500 11px Jost,sans-serif;letter-spacing:.3em;color:var(--gold);white-space:nowrap;text-shadow:0 2px 10px rgba(3,6,21,.9)}
#ftag.on{opacity:1}
body.map #tag,body.map #ftag{opacity:0!important}

/* mute */

/* Juno */
#jn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);width:min(580px,94vw);display:flex;gap:10px;align-items:flex-end;pointer-events:none;opacity:0;transition:opacity 1.6s}
#jn.show{opacity:1}
body.map #jn{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 14px);left:12px;transform:none;width:auto}
body.map #bub{display:none}
#orbw{flex:none;will-change:transform}
.orb{position:relative;width:68px;height:68px;animation:fl 4.2s ease-in-out infinite;filter:brightness(.34) saturate(.45) drop-shadow(0 0 4px rgba(143,176,255,.25));transition:filter 2.4s ease}
#orbw.awake .orb{filter:brightness(1) saturate(1) drop-shadow(0 0 16px rgba(212,179,106,.6))}
#orbw.pulse .orb{animation:fl 4.2s ease-in-out infinite,pl 1.6s ease-out 1}
@keyframes fl{50%{transform:translateY(-7px)}}
@keyframes pl{0%{filter:brightness(1) drop-shadow(0 0 16px rgba(212,179,106,.6))}35%{filter:brightness(1.35) drop-shadow(0 0 34px rgba(240,216,154,.95))}100%{filter:brightness(1) drop-shadow(0 0 16px rgba(212,179,106,.6))}}
.jx{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .55s ease;pointer-events:none}
.jx.on{opacity:1;z-index:2}.jx.old{opacity:1;z-index:1;transition:none}.jx.bl{opacity:1;z-index:3}
#bub{flex:1;min-height:56px;padding:14px 18px;border-radius:18px 18px 18px 4px;background:rgba(5,9,22,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(212,179,106,.4);font:500 21px/1.35 "Cormorant Garamond",Georgia,serif;cursor:pointer;opacity:0;transition:opacity .6s;pointer-events:none}
#bub.on{opacity:1;pointer-events:auto}

/* action + hint */
#act{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);pointer-events:auto;padding:16px 28px;min-height:52px;border-radius:999px;border:1px solid var(--gold);background:rgba(6,11,28,.72);color:var(--gold);font:500 14px Jost,sans-serif;letter-spacing:.22em;cursor:pointer;opacity:0;visibility:hidden;transition:opacity 1s,box-shadow .4s,visibility 0s 1s;white-space:nowrap;backdrop-filter:blur(6px)}
#act.on{opacity:1;visibility:visible;transition:opacity 1s,box-shadow .4s;box-shadow:0 0 28px rgba(212,179,106,.35)}
#hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 36px);transform:translateX(-50%);width:max-content;max-width:90vw;padding:9px 16px;border-radius:999px;background:rgba(5,9,22,.62);text-align:center;font:500 12px/1.4 Jost,sans-serif;letter-spacing:.16em;color:#e6edf9;text-transform:uppercase;opacity:0;transition:opacity 1.2s;pointer-events:none}
#hint.on{opacity:1}

/* registry */
#reg{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(440px,88vw);text-align:center;pointer-events:none;opacity:0;transition:opacity 1.4s}
#reg.on{opacity:1}
#reg::before{content:"";position:absolute;inset:-80px -50px;background:radial-gradient(closest-side,rgba(3,6,21,.8),rgba(3,6,21,.55) 60%,rgba(3,6,21,0));z-index:-1}
#reg .row{opacity:0;transform:translateY(8px);transition:opacity 1.1s,transform 1.1s;margin:0 0 18px}
#reg .row.on{opacity:1;transform:none}
#reg small{display:block;font:500 12px Jost,sans-serif;letter-spacing:.34em;color:#aac2ff;margin-bottom:5px}
#reg b{display:block;font:600 34px "Cormorant Garamond",Georgia,serif;letter-spacing:.14em;color:var(--silver);font-weight:600}
#reg .ok{font:500 13px Jost,sans-serif;letter-spacing:.5em;color:var(--gold);margin-top:6px;padding-top:14px;border-top:1px solid rgba(212,179,106,.45);opacity:0;transition:opacity 1.2s}
#reg .ok.on{opacity:1}

/* map info panel */

/* mute + map chrome — one thin-line design system (Jost) */
#mute{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(160,185,230,.28);background:rgba(5,9,22,.45);color:rgba(223,230,242,.85);pointer-events:auto;cursor:pointer;display:grid;place-items:center;padding:0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#mute svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
#mute .slash{display:none}#mute.off .slash{display:block}#mute.off .wave{display:none}
#maptitle{position:absolute;top:calc(env(safe-area-inset-top,0px) + 27px);left:50%;transform:translateX(-50%);font:500 10px Jost,sans-serif;letter-spacing:.32em;color:rgba(160,185,235,.85);opacity:0;transition:opacity 1.6s;white-space:nowrap}
body.map #maptitle.on{opacity:1}
#jdot{position:absolute;top:calc(env(safe-area-inset-top,0px) + 26px);left:16px;display:none;align-items:center;gap:8px;font:500 9.5px Jost,sans-serif;letter-spacing:.2em;color:rgba(200,212,235,.7)}
#jdot i{width:6px;height:6px;border-radius:50%;background:#e2c47e;box-shadow:0 0 8px 1px rgba(226,196,126,.55);animation:jd 3.6s ease-in-out infinite}
@keyframes jd{50%{opacity:.45}}
body.map #jdot{display:flex}body.map #orbw{display:none}
#info{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,10px);width:min(440px,92vw);padding:12px 12px 12px 16px;border-radius:12px;background:rgba(6,11,26,.74);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(160,185,230,.2);display:flex;align-items:center;gap:14px;opacity:0;visibility:hidden;transition:opacity .5s,transform .5s,visibility 0s .5s;pointer-events:none}
#info.on{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .5s,transform .5s;pointer-events:auto}
#info .txt{flex:1;min-width:0}
#info .n{display:flex;align-items:center;gap:8px;font:500 14px Jost,sans-serif;letter-spacing:.14em;color:#e8eefa}
#info .n i{width:5px;height:5px;border-radius:50%;background:#8caff5;flex:none}
#info .n i.done{background:#d6be82}#info .n i.lock{background:#7d8aa8}
#info .n span#ist{font:400 9.5px Jost,sans-serif;letter-spacing:.16em;color:rgba(190,205,235,.7)}
#info .s{font:400 13px Jost,sans-serif;color:rgba(210,220,240,.75);margin-top:3px;letter-spacing:.02em}
#ien{display:none;flex:none;padding:0 20px;min-height:44px;border-radius:8px;border:1px solid rgba(214,190,130,.65);background:rgba(214,190,130,.06);color:#e2c984;font:500 12px Jost,sans-serif;letter-spacing:.2em;cursor:pointer}
#ien.on{display:block}#ien:hover{background:rgba(214,190,130,.14)}
#inote{font:400 10px Jost,sans-serif;letter-spacing:.06em;color:rgba(200,212,235,.6);margin-top:3px;min-height:0}
#fade{position:fixed;inset:0;background:#030615;opacity:0;pointer-events:none;transition:opacity 1.2s}
@media (max-width:480px){#tag{font-size:23px}#bub{font-size:19px;padding:12px 15px}.orb{width:60px;height:60px}#reg b{font-size:30px}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}#orbw.pulse .orb{animation:pl 1.6s ease-out 1}}
</style></head>
<body>
<canvas id="c" aria-label="ORIGIN — a night view over an icy mountain world"></canvas>
<div id="ui">
 <div id="tag">ORIGIN<small>THE CAPTAIN’S UNIVERSE</small></div>
 <div id="ftag"></div>
 <div id="maptitle">GALAXY MAP</div>
 <button id="mute" aria-label="Sound on. Tap to mute" title="Sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.6L12 18.5v-13L7.6 9.5H4z"/><path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path class="slash" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
 <div id="reg" aria-live="polite"></div>
 <div id="jn"><div id="orbw"><div class="orb" id="orb"></div></div><div id="bub" tabindex="0" role="button" aria-live="polite" aria-label="Juno is speaking. Tap to skip the typing."></div></div>
 <div id="hint"></div>
 <button id="act"></button>
 <div id="info"><div class="txt"><div class="n"><span id="in"></span><i id="idot"></i><span id="ist"></span></div><div class="s" id="is"></div><div id="inote"></div></div><button id="ien">ENTER</button></div>
 <div id="jdot"><i></i>JUNO</div>
</div>
<div id="fade"></div>

/* =====================================================================
   helpers
   ===================================================================== */
const $=id=>document.getElementById(id);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const R=matchMedia('(prefers-reduced-motion:reduce)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

/* =====================================================================
   canvas + view
   ===================================================================== */
const cv=$('c'),ctx=cv.getContext('2d',{alpha:false});
const IW=1456,IH=720;
const COARSE=matchMedia('(pointer:coarse)').matches;
let W=0,H=0,DPR=1,lowFx=false,vig=null;
const cam={cx:700,cy:150,z:1.75};
const view={cx:700,cy:150,s:1};
function baseScale(){return Math.max(H/IH,W/IW)}
function camClamp(){const s=baseScale()*cam.z,hw=W/s/2,hh=H/s/2;cam.cx=clamp(cam.cx,hw,IW-hw);cam.cy=clamp(cam.cy,hh,IH-hh)}
const toS=(x,y)=>[(x-view.cx)*view.s+W/2,(y-view.cy)*view.s+H/2];
const toI=(px,py)=>[(px-W/2)/view.s+view.cx,(py-H/2)/view.s+view.cy];
function focusTarget(x,y,z,ax=.5,ay=.4){const s=baseScale()*z,hw=W/s/2,hh=H/s/2;return{cx:clamp(x+(.5-ax)*W/s,hw,IW-hw),cy:clamp(y+(.5-ay)*H/s,hh,IH-hh),z}}
function resize(){
  W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,lowFx?1:(COARSE?1.25:1.5));
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  vig=document.createElement('canvas');vig.width=Math.max(2,Math.round(W/2));vig.height=Math.max(2,Math.round(H/2));
  const g=vig.getContext('2d'),w=vig.width,h=vig.height;
  let gr=g.createRadialGradient(w/2,h/2,Math.min(w,h)*.3,w/2,h/2,Math.max(w,h)*.78);gr.addColorStop(0,'rgba(2,5,16,0)');gr.addColorStop(1,'rgba(2,5,16,.3)');g.fillStyle=gr;g.fillRect(0,0,w,h);
  gr=g.createLinearGradient(0,h*.6,0,h);gr.addColorStop(0,'rgba(2,5,16,0)');gr.addColorStop(1,'rgba(2,5,16,.36)');g.fillStyle=gr;g.fillRect(0,0,w,h);
  gr=g.createLinearGradient(0,0,0,h*.2);gr.addColorStop(0,'rgba(2,5,16,.34)');gr.addColorStop(1,'rgba(2,5,16,0)');g.fillStyle=gr;g.fillRect(0,0,w,h);
  camClamp();if(typeof MAP!=='undefined')MAP.rt=true;
}
addEventListener('resize',resize);

/* sprites */
function glowSprite(rgb,size=128){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d'),gr=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  gr.addColorStop(0,`rgba(${rgb},1)`);gr.addColorStop(.22,`rgba(${rgb},.4)`);gr.addColorStop(.55,`rgba(${rgb},.1)`);gr.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=gr;g.fillRect(0,0,size,size);return c}
const gStar=glowSprite(CFG.STAR_COLOR),gGold=glowSprite('230,196,120'),gViolet=glowSprite('150,120,255');
const gBlue2=glowSprite('120,150,255');
const gMist=(()=>{const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d'),gr=g.createRadialGradient(128,32,0,128,32,128);gr.addColorStop(0,'rgba(170,192,225,.9)');gr.addColorStop(1,'rgba(170,192,225,0)');g.save();g.scale(1,.25);g.translate(0,96);g.fillStyle=gr;g.fillRect(0,-96,256,256);g.restore();return c})();
function drawGlow(sp,x,y,r,a){if(a<=0.003)return;ctx.globalAlpha=Math.min(1,a);ctx.drawImage(sp,x-r,y-r,r*2,r*2);ctx.globalAlpha=1}

/* =====================================================================
   tweens
   ===================================================================== */
const TW=[];
function tween(o,to,dur,ez=ease){return new Promise(res=>{
  for(let i=TW.length;i--;)if(TW[i].o===o){const t=TW.splice(i,1)[0];t.res()}
  const from={};for(const k in to)from[k]=o[k];
  const d=Math.max(dur,1)/1000*(R?.35:1);TW.push({o,from,to,t:0,d,ez,res})})}
function stepTweens(dt){for(let i=TW.length;i--;){const w=TW[i];w.t+=dt;const k=Math.min(1,w.t/w.d),e=w.ez(k);for(const p in w.to)w.o[p]=lerp(w.from[p],w.to[p],e);if(k>=1){TW.splice(i,1);w.res()}}}
const camTo=(t,dur)=>tween(cam,t,dur);

const R1=rng(7);
const SK=[];for(let i=0;i<420;i++){const y=4+Math.pow(R1(),1.25)*250;SK.push({x:R1()*IW,y,r:.5+R1()*1.1,a:.35+R1()*.55,sp:.6+R1()*2.2,ph:R1()*6.28,aw:i>=130?1:0})}
const DUST=[];for(let i=0;i<46;i++)DUST.push({x:R1(),y:R1(),sp:.004+R1()*.012,dx:(R1()-.5)*.006,r:.6+R1()*1.2,ph:R1()*6.28});
const MIST=[[200,455,1100,.045,.004],[620,470,1400,.04,-.003],[1000,438,1000,.035,.005],[400,500,1500,.03,-.004],[1250,480,1200,.035,.003]];

function drawSurface(dt){
  const s=baseScale()*cam.z,sw=W/s,sh=H/s;
  let ox=0,oy=0;if(!R&&cam.z>1.03){ox=Math.sin(T*.11)*2;oy=Math.cos(T*.09)*1.5}
  const sx=clamp(cam.cx+ox-sw/2,0,IW-sw),sy=clamp(cam.cy+oy-sh/2,0,IH-sh);
  view.cx=sx+sw/2;view.cy=sy+sh/2;view.s=s;
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  ctx.fillStyle='#030615';ctx.fillRect(0,0,W,H);
  try{ctx.drawImage(bgImg,sx,sy,sw,sh,0,0,W,H)}catch(e){}
  const aw=WORLD.awake,sq=Math.sqrt(s);
  // twinkling stars
  const nStars=lowFx?160:(COARSE?280:SK.length);
  ctx.fillStyle='#dfe9ff';
  for(let i=0;i<nStars;i++){const k=SK[i];if(k.aw&&aw<=0)continue;const al=k.a*(k.aw?aw:1)*(.55+.45*Math.sin(T*k.sp+k.ph));
    const px=(k.x-view.cx)*s+W/2,py=(k.y-view.cy)*s+H/2;if(px<-4||py<-4||px>W+4||py>H+4)continue;
    ctx.globalAlpha=al;const r=k.r*sq;ctx.fillRect(px-r/2,py-r/2,r,r)}
  ctx.globalAlpha=1;
  // glows (additive)
  ctx.globalCompositeOperation='lighter';
  if(aw>0){
    let [nx,ny]=toS(610,160);drawGlow(gBlue2,nx,ny,170*s,.2*aw);
    [nx,ny]=toS(820,95);drawGlow(gViolet,nx,ny,200*s,.13*aw);
    [nx,ny]=toS(925,288);drawGlow(gBlue2,nx,ny,70*s,.2*aw*(.8+.2*Math.sin(T*.7)));
    for(let i=0;i<TOWERS.length;i++){const [tx,ty]=toS(TOWERS[i][0],TOWERS[i][1]);const p=.7+.3*Math.sin(T*1.3+i*2);
      drawGlow(gGold,tx,ty,14*sq,.85*aw*p);ctx.fillStyle='#f6dfa4';ctx.globalAlpha=aw;ctx.fillRect(tx-1,ty-1,2,2);ctx.globalAlpha=1}
  }
  ctx.globalCompositeOperation='source-over';

const MAPIMG={};
function mapImg(pt){const k=pt?'P':'L';let e=MAPIMG[k];
  if(!e){e=MAPIMG[k]={c:null};const im=new Image();

let last=performance.now(),lastDraw=0,fcount=0,facc=0,prevCx=cam.cx,prevCy=cam.cy;
document.addEventListener('visibilitychange',()=>{last=performance.now()});
function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden)return;
  const busy=TW.length||P.size||Math.abs(vel.x)>.02||Math.abs(vel.y)>.02||WORLD.vis<1;
  if(!busy&&now-lastDraw<31)return;lastDraw=now;
  const dt=Math.min((now-last)/1000,.05);last=now;T+=dt;
  if(busy&&fcount<150&&dt>0){fcount++;facc+=dt;if(fcount===90||fcount===150){const avg=facc/fcount;if(avg>.027&&!lowFx){lowFx=true;resize()}}}
  stepTweens(dt);
  if(!R&&canExplore()&&!P.size&&(Math.abs(vel.x)>.02||Math.abs(vel.y)>.02)){cam.cx+=vel.x;cam.cy+=vel.y;vel.x*=.93;vel.y*=.93;camClamp()}
  camClamp();
  const pvx=(cam.cx-prevCx)*view.s/Math.max(dt,.001),pvy=(cam.cy-prevCy)*view.s/Math.max(dt,.001);prevCx=cam.cx;prevCy=cam.cy;
  if(mode==='surface')drawSurface(dt);else drawMap(dt);
  if(WORLD.vis<.999){ctx.fillStyle=`rgba(3,6,21,${1-WORLD.vis})`;ctx.fillRect(0,0,W,H)}
  updateOrb(dt,mode==='surface'?pvx:0,mode==='surface'?pvy:0);
}

const bgImg=new Image();
async function boot(){
  const holdP=/[?&]hold\b/.test(location.search)?new Promise(r=>{addEventListener('message',e=>{if(e.data&&e.data.type==='sidduverse:go')r()});setTimeout(r,25000)}):null;
  resize();
  try{bgImg.src=BG;await bgImg.decode()}catch(e){}
  requestAnimationFrame(t=>{last=t;frame(t)});
  if(holdP)await holdP;
  const done=ls.get(CFG.KEY.origin)==='1',stage=+ls.get(CFG.KEY.stage)||0;
  if(done&&/[?&]map\b/.test(location.search)){applyDoneState();await goMap()}
  else if(done){await revisit(false)}
  else if(stage>=1){await resume(stage)}
  else await startFresh();
}
window.__sv={get phase(){return phase},get mode(){return mode},toS,STAR,MARK,FR,cam,get view(){return view},PLANETS,selectPlanet,hitPlanet,get lowFx(){return lowFx}};
boot();
scheduleBake();
})();
