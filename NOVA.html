<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NOVA — The Final World</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#04060f;overflow:hidden;color:#e6ecff;font-family:Jost,system-ui,sans-serif}
#bg{position:fixed;inset:-4%;background:center/cover;transition:transform 3s ease-in-out,opacity 2.5s;opacity:0;transform:scale(1)}
#scrim{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,rgba(3,6,18,.5),rgba(3,6,18,.18) 72%)}
#cv{position:fixed;inset:0;width:100%;height:100%}
#txt,#title{position:fixed;left:0;right:0;text-align:center;padding:0 9%;font-family:"Cormorant Garamond",serif;pointer-events:none}
#txt{top:50%;transform:translateY(-50%);font-size:clamp(22px,5.4vw,34px);line-height:1.5;opacity:0;transition:opacity 1.6s}
#txt b{font-weight:600;color:#fff}#txt i{color:#cfd6ff}#txt .big{display:block;margin-top:14px;font-size:1.2em;color:#fff;text-shadow:0 0 22px #9fb4ff}
#title{top:38%;opacity:0;transition:opacity 2s}#title h1{margin:0;font-size:clamp(46px,14vw,92px);letter-spacing:.3em;font-weight:500;text-indent:.3em}#title p{margin:10px 0 0;font-style:italic;font-size:clamp(18px,4.4vw,24px);color:#b9c4f0}
#kick{position:fixed;left:0;right:0;top:max(14%,calc(env(safe-area-inset-top) + 56px));text-align:center;padding:0 8%;font-size:12px;letter-spacing:.34em;line-height:1.9;color:#aebcf2;opacity:0;transition:opacity 1.4s;pointer-events:none}#kick.bd{font-family:"Cormorant Garamond",serif;font-size:clamp(26px,7vw,40px);letter-spacing:.06em;color:#fff;text-shadow:0 0 24px #9fb4ff}
#hint{position:fixed;left:0;right:0;bottom:calc(9% + env(safe-area-inset-bottom));text-align:center;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#cfd8ff;opacity:0;transition:opacity 1s;pointer-events:none}
#lab{position:fixed;left:0;right:0;top:30%;text-align:center;opacity:0;transition:opacity 1.4s;pointer-events:none;letter-spacing:.28em;font-size:13px}#lab b{display:block;font-size:17px;margin-bottom:8px;color:#fff}
#glow{position:fixed;inset:0;background:radial-gradient(circle at 50% 42%,#fff 0,#dfe8ff 30%,#9fb0ff 70%);opacity:0;pointer-events:none}
#name{position:fixed;left:0;right:0;top:34%;text-align:center;pointer-events:none;font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(44px,15vw,96px);letter-spacing:.14em;text-indent:.14em;white-space:nowrap}
#name span{display:inline-block;opacity:0;filter:blur(14px);transform:translateY(10px) scale(1.15);transition:all 2.2s cubic-bezier(.2,.7,.2,1);background:linear-gradient(#fff,#b8c6ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(150,170,255,.35)}
#name span.on{opacity:1;filter:none;transform:none}#name .gap{width:.5em}
#sub{position:fixed;left:0;right:0;top:calc(34% + clamp(70px,22vw,130px));text-align:center;letter-spacing:.34em;font-size:12px;opacity:0;transition:opacity 2.5s;color:#cfd8ff;pointer-events:none}
#juno{position:fixed;left:50%;bottom:calc(26% + env(safe-area-inset-bottom));width:clamp(86px,24vw,130px);transform:translate(-50%,16px);opacity:0;transition:all 1.6s;pointer-events:none;filter:drop-shadow(0 0 22px rgba(255,214,120,.55))}#juno.on{opacity:1;transform:translate(-50%,0);animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{translate:0 -8px}}
#bub{position:fixed;left:50%;bottom:calc(3% + env(safe-area-inset-bottom));width:min(92%,520px);transform:translateX(-50%);padding:16px 18px;border:1px solid rgba(190,205,255,.25);border-radius:16px;background:rgba(8,12,30,.78);backdrop-filter:blur(6px);font-size:clamp(15px,4vw,18px);line-height:1.5;opacity:0;pointer-events:none;transition:opacity .6s;min-height:84px}#bub.on{opacity:1;pointer-events:auto}#bub.em{color:#fff;text-shadow:0 0 16px #a8b8ff;font-family:"Cormorant Garamond",serif;font-size:clamp(19px,5vw,24px)}
#bub small{display:block;margin-top:6px;text-align:right;font-size:10px;letter-spacing:.25em;color:#8d9bd0}
#logw{position:fixed;left:50%;top:max(4%,env(safe-area-inset-top));width:min(94%,520px);transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity 1.2s;z-index:3}#logw.on{opacity:1}#logw.hub{pointer-events:auto}
#logw h2{margin:0 0 6px;text-align:center;font-size:12px;letter-spacing:.4em;font-weight:500;color:#cfd8ff}
#cd{text-align:center;margin-bottom:12px;min-height:66px}#cd .k{font-size:9px;letter-spacing:.42em;color:#8d9bd0}#cd .n{font-family:"Cormorant Garamond",serif;font-size:17px;letter-spacing:.14em;color:#e6ecff;margin:3px 0 6px}#cd .t{display:flex;justify-content:center;gap:14px}#cd .t div{min-width:44px}#cd .t b{display:block;font-family:"Cormorant Garamond",serif;font-weight:500;font-size:24px;line-height:1;color:#dfe7ff;font-variant-numeric:tabular-nums}#cd .t i{font-style:normal;font-size:8px;letter-spacing:.3em;color:#7f8fc4}#cd .done{font-family:"Cormorant Garamond",serif;font-size:16px;letter-spacing:.1em;color:#ffe3a6;padding-top:8px}
.card{position:relative;display:flex;align-items:center;gap:14px;padding:10px 14px;margin-bottom:10px;border:1px solid rgba(190,205,255,.16);border-radius:12px;background:rgba(8,12,30,.72);backdrop-filter:blur(5px);overflow:hidden;transition:border-color 1s,box-shadow 1s,opacity 1s;opacity:.78}
.card.un{opacity:1;border-color:rgba(255,224,160,.5);cursor:pointer}.card.un:hover{box-shadow:0 0 18px rgba(255,224,160,.14)}
.card svg{flex:none;width:64px;height:46px;overflow:visible}.card .tx{min-width:0}
.card h3{margin:0;font-family:"Cormorant Garamond",serif;font-size:20px;letter-spacing:.14em;font-weight:600}.card .d{font-size:10px;letter-spacing:.24em;color:#aeb9e8;margin:2px 0 4px}.card .s{font-size:9px;letter-spacing:.32em;color:#9aa6d4}.card.un .s{color:#ffe3a6}
.card .bd{fill:#141b36;stroke:#8fa0d6;stroke-opacity:.55}.card.un .bd{stroke:#e8cf94;stroke-opacity:.8}
.card .fl{fill:#1b2446;stroke:#8fa0d6;stroke-opacity:.55;transform-origin:32px 12px;transition:transform 1.1s cubic-bezier(.5,0,.2,1),fill 1s}.card.un .fl{transform:scaleY(-1);fill:#222b52;stroke:#e8cf94;stroke-opacity:.8}
.card .pp{fill:#e9e4d4;opacity:0;transform:translateY(0);transition:opacity .8s .5s,transform 1s .6s}.card.un .pp{opacity:.9;transform:translateY(-5px)}
.card .sl{fill:#b9a574;stroke:#e9dcb2;stroke-opacity:.6;transition:opacity .9s,transform .9s;transform-origin:32px 21px}.card.un .sl{opacity:0;transform:scale(.4)}
.card::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:35%;background:linear-gradient(100deg,transparent,rgba(255,240,205,.16),transparent);opacity:0;pointer-events:none}
.card.opening::after{animation:sw 1.7s ease-out .7s}@keyframes sw{0%{left:-40%;opacity:1}100%{left:110%;opacity:1}}
.card.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#ltr{position:fixed;inset:0;z-index:6;background:#03050d;display:none;overflow:auto;-webkit-overflow-scrolling:touch}#ltr.on{display:block}
#ltr .bar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:14px 64px 14px 18px;background:linear-gradient(rgba(3,5,13,1),rgba(3,5,13,.85));z-index:1}#ltr .bar span{font-size:10px;letter-spacing:.4em;color:#7f8fc4}
#ltr .pg{max-width:620px;margin:0 auto;padding:18px 24px calc(60px + env(safe-area-inset-bottom));font-family:"Cormorant Garamond",serif;font-size:clamp(19px,4.8vw,22px);line-height:1.75;color:#e4e9fb}
#ltr h1{margin:10px 0 6px;text-align:center;font-weight:600;font-size:clamp(26px,7vw,34px);letter-spacing:.2em}#ltr .sub{text-align:center;font-family:Jost,sans-serif;font-size:11px;letter-spacing:.32em;color:#e8cf94;margin-bottom:34px}#ltr .bd2{white-space:pre-wrap}#ltr .bk{display:block;margin:40px auto 0}
#ltr button,.btn{font:inherit;font-family:Jost,sans-serif;font-size:12px;letter-spacing:.3em;color:#fff;background:rgba(120,140,230,.18);border:1px solid rgba(200,212,255,.5);border-radius:30px;padding:13px 22px;cursor:pointer}
#end{position:fixed;left:0;right:0;bottom:calc(8% + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;pointer-events:none;transition:opacity 1.5s;z-index:4}#end.on{opacity:1;pointer-events:auto}
#mute{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:8;width:38px;height:38px;border-radius:50%;border:1px solid rgba(200,212,255,.35);background:rgba(8,12,30,.5);color:#dfe6ff;font-size:15px}
#fade{position:fixed;inset:0;background:#04060f;opacity:1;transition:opacity 2.4s;pointer-events:none;z-index:9}
</style></head><body>
<div id="bg"></div><div id="scrim"></div><canvas id="cv"></canvas>
<div id="title"><h1>NOVA</h1><p>The final world.</p></div><div id="txt"></div><div id="kick"></div><div id="lab"></div><div id="hint"></div>
<div id="name"></div><div id="sub">THE UNIVERSE IS COMPLETE.</div><div id="glow"></div>
<div id="logw"><h2>CAPTAIN’S LOG</h2><div id="cd"></div><div id="cards"></div></div>
<img id="juno" alt=""><div id="bub"></div><div id="end"></div><div id="ltr"></div>
<button id="mute" aria-label="Mute">♪</button><div id="fade"></div>

{h:"ORIGIN OF THIS UNIVERSE: IDENTIFIED",l:["You might be wondering who put all this together.","Well, it wasn't the stars.","It wasn't some distant civilisation.","And definitely not an actual space agency.","It was someone who wanted to make your birthday a little different this year.","Someone who remembered a few little things, held on to some memories and decided to turn them into an entire universe.","**That someone was me.**"]},
{h:"HAPPY BIRTHDAY, SIDDUUUU! 🎂❤️",cls:"bd",l:["I hope this year brings you closer to everything you've been working towards.","More places to see, more things to try, more reasons to be proud of yourself…","And plenty of moments where you can just sit back and think, *yeah, life is good.*","I hope you enjoy this year, not just rush through it.","**You deserve some really good days ahead.** ✨"]},
