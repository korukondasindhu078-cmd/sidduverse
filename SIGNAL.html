<html lang="en"><head><meta charset="utf-8">

<meta name="theme-color" content="#02050f"><title>SIGNAL</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Hanken+Grotesk:wght@400;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ice:#C6DFF2;--cy:#8fd6e8;--vi:#8B79C9;--gold:#e8c985;--tx:#EDF3FA;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Hanken Grotesk",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#02050f;color:var(--tx);font-family:var(--sans);touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 40%,#0b1330 0,#060b1f 40%,#03060f 70%,#02050f 100%)}
#scene{position:absolute;inset:0}
#struct{position:absolute;left:50%;top:46%;width:min(64vw,300px);aspect-ratio:1;margin:calc(min(64vw,300px)/-2) 0 0 calc(min(64vw,300px)/-2);opacity:0;transform:scale(.05);transition:transform 6s cubic-bezier(.2,.6,.2,1),opacity 3s,border-color 2.5s,box-shadow 2.5s;border-radius:50%;border:1px solid rgba(198,223,242,.5);box-shadow:0 0 50px rgba(139,121,201,.4),inset 0 0 40px rgba(139,121,201,.22)}
#struct.in{opacity:1;transform:none}
#struct i{position:absolute;border-radius:50%;border:1px solid rgba(198,223,242,.3)}
#struct i:nth-child(1){inset:11%;border-style:dashed;animation:rot 90s linear infinite}
#struct i:nth-child(2){inset:24%;border-color:rgba(143,214,232,.4);animation:rot 60s linear infinite reverse}
#struct i:nth-child(3){inset:38%;background:radial-gradient(circle,rgba(198,223,242,.35),transparent 70%);border:0}
.wv{inset:0!important;animation:wv 6s ease-out infinite}.wv.w2{animation-delay:2s}.wv.w3{animation-delay:4s}
@keyframes wv{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.6);opacity:0}}@keyframes rot{to{transform:rotate(360deg)}}
#struct.gold{border-color:var(--gold);box-shadow:0 0 70px rgba(232,201,133,.55),inset 0 0 50px rgba(232,201,133,.3)}
#struct.gold i{border-color:rgba(232,201,133,.5)}#struct.gold i:nth-child(3){background:radial-gradient(circle,rgba(255,236,190,.6),transparent 70%)}
#struct.fade{opacity:0;transition:opacity 4s}
.pt{position:absolute;width:60px;height:60px;margin:-30px;border:0;border-radius:50%;padding:0;opacity:0;pointer-events:none;background:radial-gradient(circle,#fff 0,#fff 8%,rgba(198,223,242,.5) 22%,transparent 62%);transition:opacity 2s,filter 2s}
.pt.show{opacity:1;pointer-events:auto;animation:pp 3.4s ease-in-out infinite}
.pt.open{animation:none;background:radial-gradient(circle,#fff 0,#fff 12%,rgba(232,201,133,.7) 30%,transparent 68%)}
.pt.glow{filter:drop-shadow(0 0 12px #e8c985)}.pt.fade{opacity:0;pointer-events:none;transition:opacity 4s}
@keyframes pp{50%{transform:scale(1.22);opacity:.65}}
.ln{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ln path{fill:none;vector-effect:non-scaling-stroke;stroke-width:1}
#lines{opacity:0;transition:opacity 3s}#lines.on{opacity:1}#lines path{stroke:rgba(232,201,133,.7)}#lines.fade{opacity:0;transition:opacity 4s}
#trace path{stroke:var(--cy);stroke-dasharray:130;stroke-dashoffset:130;transition:stroke 3.5s}#trace.gold path{stroke:var(--gold)}
#fr{position:absolute;width:16px;height:16px;margin:-8px;border-radius:50%;background:#fff;box-shadow:0 0 26px #e8c985,0 0 70px #e8c985;opacity:0;z-index:6;transition:left 2.6s cubic-bezier(.5,0,.3,1),top 2.6s cubic-bezier(.5,0,.3,1),opacity .8s,transform 2.6s}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.08;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:gr 1.2s steps(4) infinite}
@keyframes gr{25%{background-position:40px 20px}50%{background-position:-30px 60px}75%{background-position:20px -40px}}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 52%,rgba(0,0,0,.6) 100%)}
#label{position:absolute;left:0;right:0;top:44%;text-align:center;font:600 12px var(--sans);letter-spacing:.45em;color:var(--ice);opacity:0;transition:opacity 1.4s;pointer-events:none;text-indent:.45em}
#juno{position:absolute;left:14px;top:max(14px,env(safe-area-inset-top));width:60px;height:60px;z-index:8;filter:drop-shadow(0 0 12px rgba(232,201,133,.4));transition:filter 2.5s}
#juno.glow{filter:drop-shadow(0 0 22px rgba(255,220,150,.95))}
#orb{position:relative;width:100%;height:100%}
.jx{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .55s ease;will-change:opacity}.jx.on{opacity:1;z-index:2}.jx.old{opacity:1;z-index:1;transition:none}.jx.bl{opacity:1;z-index:3}
#bub{position:absolute;left:86px;right:14px;top:max(18px,calc(env(safe-area-inset-top) + 4px));z-index:8;padding:11px 14px;border-radius:14px;background:rgba(4,9,32,.6);border:1px solid rgba(198,223,242,.18);font:400 15px/1.5 var(--sans);opacity:0;transition:opacity .7s;pointer-events:none}
#status{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 124px);text-align:center;white-space:pre-line;font:500 11px/1.8 var(--mono);letter-spacing:.2em;color:var(--ice);opacity:0;transition:opacity 1.4s;pointer-events:none;padding:0 20px}
#card{position:absolute;left:6%;right:6%;top:50%;transform:translateY(-46%);z-index:7;padding:26px 22px 22px;text-align:center;border:1px solid rgba(198,223,242,.3);border-radius:18px;background:rgba(6,12,38,.9);opacity:0;pointer-events:none;transition:opacity .8s,transform .8s}
#card.on{opacity:1;pointer-events:auto;transform:translateY(-50%)}
#card .m{white-space:pre-line;margin:6px 0 4px;font:italic 500 1.45rem/1.45 var(--serif)}
#card .h{white-space:pre-line;font:600 10.5px/1.8 var(--mono);letter-spacing:.18em;color:var(--ice)}
#card .tx{margin:14px 0 0;font:italic 500 1.2rem/1.5 var(--serif);color:var(--ice)}
.b{min-width:44px;min-height:44px;padding:0 20px;margin:8px 4px 0;background:rgba(7,20,38,.5);border:1px solid rgba(198,223,242,.6);color:var(--tx);border-radius:26px;font:600 11.5px var(--sans);letter-spacing:.16em;cursor:pointer}
.x{position:absolute;top:2px;right:4px;width:48px;height:48px;background:none;border:0;color:var(--ice);font-size:26px;line-height:1}
#play{width:70px;height:70px;margin:14px auto 4px;display:block;border-radius:50%;border:1px solid var(--gold);background:rgba(232,201,133,.14);color:#fff;font-size:22px;cursor:pointer}
#cont{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 26px);margin:0 auto;width:max-content;z-index:7;opacity:0;pointer-events:none;transition:opacity 1.4s}#cont.on{opacity:1;pointer-events:auto}
#mute,#vp{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:7;margin:0;min-height:44px;font-size:10.5px;padding:0 14px}
#mute{left:14px}#vp{right:14px;opacity:0;pointer-events:none;transition:opacity 1.4s}#vp.on{opacity:1;pointer-events:auto}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#grain,.neb,#struct i{animation:none}}
#gl,#fx{position:absolute;inset:0;width:100%;height:100%}#fx{pointer-events:none}

#struct i{display:none}
.ln,.pt{z-index:3}
#vig{background:radial-gradient(ellipse at 50% 46%,transparent 58%,rgba(0,0,0,.5) 100%)}

#vig{background:radial-gradient(ellipse at 50% 46%,transparent 64%,rgba(0,0,0,.18) 100%)}
#world{position:absolute;left:0;top:0;width:768px;height:1376px;transform-origin:0 0;will-change:transform;pointer-events:none;background:#0a1020;--gc:205,150,85;--lit:0}
#bgi{display:block;width:768px;height:1376px}
.mist{position:absolute;left:-200px;width:1168px;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(150,170,205,.13),transparent 66%)}
.m1{top:600px;height:300px;animation:dr1 70s ease-in-out infinite alternate}.m2{top:840px;height:380px;animation:dr2 95s ease-in-out infinite alternate}

.lgd{position:absolute;width:64px;height:64px;margin:-32px;border-radius:50%;background:radial-gradient(circle,rgba(var(--gc),.75) 0,rgba(var(--gc),.25) 28%,transparent 66%);opacity:calc(.3 + var(--lit)*.5)}
.lgd.b{animation:bp 8s ease-in-out infinite}@keyframes bp{0%,72%,100%{transform:scale(1);opacity:.5}84%{transform:scale(1.8);opacity:1}}
#fadeov{position:absolute;inset:0;background:#050a1a;opacity:0;pointer-events:none}
.pt{width:56px;height:56px;margin:-28px;background:radial-gradient(circle,#fff4d8 0,#f0d8a0 10%,rgba(205,150,85,.55) 28%,transparent 64%)}
.pt.open{background:radial-gradient(circle,#fff 0,#ffeec0 14%,rgba(240,195,110,.75) 32%,transparent 68%)}
@media (prefers-reduced-motion:reduce){.mist,.lgd.b{animation:none}}

#app.wide{background:linear-gradient(180deg,#223457 0%,#2a4068 38%,#27385a 55%,#18233a 80%,#101828 100%)}

#app.wide #mute{left:calc(50% - var(--cw)/2 + 14px)}#app.wide #vp{right:calc(50% - var(--cw)/2 + 14px)}

function setJuno(m) { if (m === jm || !LAY[m] || m === 'blink') return; const o = LAY[jm], n = LAY[m]; o.classList.add('old'); o.classList.remove('on'); n.classList.add('on'); jm = m; jsw = true; setTimeout(() => { o.classList.remove('old'); jsw = false; }, 600); }

/* ---- Juno's speech: the face changes before a line appears, never during it ---- */
const bub = $('bub'); let jt = 0;
async function say(t, f, hold) { const k = ++jt; bub.style.opacity = 0; await wait(260); if (k !== jt) return false; if (f) setJuno(f); bub.textContent = t; bub.style.opacity = 1; await wait(hold || 1400 + t.length * 42); return k === jt; }

/* ---- Sound (starts only after a tap; mute always visible) ---- */
let AC = null, master = null, dg = null, muted = false, audio = null;
function ensureAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = muted ? 0 : 1; master.connect(AC.destination);
    dg = AC.createGain(); dg.gain.value = .5; dg.connect(master);
    [55, 82.4, 110.3].forEach(f => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f; g.gain.value = .008; o.connect(g); g.connect(dg); o.start(); });

}
function tone(f, d, v, t) { if (!AC) return; const o = AC.createOscillator(), g = AC.createGain(), n = AC.currentTime + (t || 0); o.frequency.value = f; g.gain.setValueAtTime(0, n); g.gain.linearRampToValueAtTime(v, n + .05); g.gain.exponentialRampToValueAtTime(.0001, n + d); o.connect(g); g.connect(master); o.start(n); o.stop(n + d + .1); }

/* ---- State ---- */
const KEY = 'sidduverse-signal-v2'; let S = {};
const load = () => { try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; } S.open = (S.open || []).filter(i => Number.isInteger(i) && i >= 0 && i < MSGS.length); S.said = S.said || []; if (S.conn && S.open.length < MSGS.length) S = { open: S.open, said: [] }; };

const P = [[20, 48], [80, 40], [30, 36], [20, 70]], C = [50, 30];

const st = $('status'), card = $('card'), struct = $('struct');

const T_START = 'INCOMING TRANSMISSION DETECTED\nSOURCE: UNIDENTIFIED\nFREQUENCY: UNREGISTERED\nSTATUS: RECEIVING';

function build() {
  $('field').innerHTML = ''; pts = P.map((p, i) => { const b = document.createElement('button'); b.className = 'pt' + (S.open.includes(i) ? ' open' : ''); b.style.left = p[0] + '%'; b.style.top = p[1] + '%'; b.setAttribute('aria-label', 'Transmission ' + (i + 1)); b.onclick = () => tap(i); $('field').append(b); return b; });
}
const drawLines = () => { $('lines').firstElementChild.setAttribute('d', 'M ' + S.open.map(i => P[i][0] + ' ' + P[i][1]).join(' L ') + ' L ' + C[0] + ' ' + C[1]); $('lines').classList.add('on'); };

function showMsg(i) {
  return new Promise(res => {
    card.innerHTML = '<button class="x" aria-label="Close">×</button><div class="h"></div><p class="m"></p>'; card.querySelector('.h').textContent = TITLES[i]; card.querySelector('.m').textContent = MSGS[i];
    card.classList.add('on'); sfx.open();

  });
}
function react(line) { if (S.said.includes(line)) return; S.said.push(line); save(); say(line, 'calm'); }
const R = ["Okay, that one's actually quite good.", "I have a feeling these aren't random."];

async function tap(i) {

  document.addEventListener('visibilitychange', () => { last = performance.now(); lastW = 0; if (AC) { try { document.hidden ? AC.suspend() : AC.resume(); } catch (e) {} } });
